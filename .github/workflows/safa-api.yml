name: SAFA API

on:
  workflow_dispatch:
  push:
    paths:
      - 'safa-api/**'
      - '.github/workflows/safa-api.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: safa-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: safa-api/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
