name: Food Audit APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'food-audit-app/**'
      - '.github/workflows/food-audit-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: food-audit-app
    env:
      CI: '1'
      # Публичный адрес нашего API на Vercel (не секрет): Settings -> Secrets and variables -> Actions -> Variables -> API_BASE_URL.
      # Ключ ИИ в приложение не попадает: он хранится только на сервере (Vercel -> Environment Variables).
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: food-audit-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_BASE_URL" ]; then
            echo "::warning title=API URL missing::Repository variable API_BASE_URL is not set. APK will work without AI (no web search, photo mode, community)."
          else
            echo "API base URL: $EXPO_PUBLIC_API_BASE_URL"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Tests and typecheck
        run: npm test && npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: food-audit-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify APK contains no Google API key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' || { echo "::error::JS bundle not found in APK"; exit 1; }
          if unzip -p "$APK" assets/index.android.bundle | grep -aEq 'AI''za[0-9A-Za-z_-]{30,}'; then
            echo "::error::A Google API key pattern was found in the APK bundle"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: food-audit-apk
          path: food-audit-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
