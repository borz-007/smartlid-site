name: Food Audit APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'food-audit-app/**'
      - '.github/workflows/food-audit-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: food-audit-app
    env:
      CI: '1'
      # Необязательно: добавьте секрет в Settings → Secrets and variables → Actions.
      # Без него приложение работает с локальным фильтром, режим «Фото» недоступен.
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      # ВРЕМЕННО (отладка ошибок ИИ): убрать перед публичным релизом.
      EXPO_PUBLIC_DEBUG_AI_ERRORS: '1'
      # Запасная модель при 5xx/404 основной; название не проверено по живому API — сверить в AI Studio.
      EXPO_PUBLIC_GEMINI_FALLBACK_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: food-audit-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check Gemini key
        run: |
          if [ -z "$EXPO_PUBLIC_GEMINI_API_KEY" ]; then
            echo "::warning title=Gemini key missing::Repository secret EXPO_PUBLIC_GEMINI_API_KEY is not set. APK will work without AI (no web search, no photo mode)."
          else
            echo "Gemini key: set (${#EXPO_PUBLIC_GEMINI_API_KEY} chars)"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Tests and typecheck
        run: npm test && npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: food-audit-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: food-audit-apk
          path: food-audit-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
